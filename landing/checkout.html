<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Quill Pro 付款結果</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="legal.css">
</head>
<body>
  <div class="shell">
    <nav><a class="brand" href="/">✦ Quill</a><a class="back" href="/">返回官網 →</a></nav>
    <main>
      <div class="eyebrow">Quill Pro</div>
      <h1 id="title">正在確認付款結果…</h1>
      <p class="lead" id="lead">付款完成後，回到 Quill 即可自動取得 Pro 額度。</p>
      <div class="actions">
        <a class="button primary" id="openApp" href="quill://billing">開啟 Quill 查看方案</a>
        <a class="button" href="/#pricing">查看方案說明</a>
      </div>
      <article class="document">
        <h2 id="detailTitle">接下來</h2>
        <p id="detail">如果 Quill 已經開啟，按上方按鈕回到「方案與用量」；狀態可能需要幾秒更新。</p>
        <div class="notice">付款由 Portaly 安全處理。Quill 不保存完整信用卡資料。</div>
      </article>
    </main>
    <footer><span>Quill · macOS only</span><span><a href="privacy.html">隱私政策</a> · <a href="terms.html">服務條款</a> · <a href="refund.html">退款政策</a></span></footer>
  </div>
  <script>
    const title = document.getElementById('title');
    const lead = document.getElementById('lead');
    const detailTitle = document.getElementById('detailTitle');
    const detail = document.getElementById('detail');
    const openApp = document.getElementById('openApp');
    const status = new URLSearchParams(location.search).get('status');
    if (status === 'success') {
      title.textContent = '付款完成，歡迎加入 Quill Pro。';
      lead.textContent = '回到 Quill 後會自動啟用每個計費週期 600 次額度。';
    } else if (status === 'canceled') {
      title.textContent = '付款已取消，沒有產生訂閱。';
      lead.textContent = '每天 10 次免費額度仍可正常使用，你可以隨時再決定。';
      detailTitle.textContent = '沒有任何變更';
      detail.textContent = '這次未完成付款，因此不會扣款，也不會建立自動續訂。';
      openApp.textContent = '回到 Quill';
    }
  </script>
</body>
</html>
