<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quill Home Window UI Prototype</title>
<style>
  :root{--bg:#0e0e12;--card:#14141a;--line:rgba(255,255,255,.09);--text:rgba(255,255,255,.88);--muted:rgba(255,255,255,.38);--blue:#60a5fa;--button-text:#0a0a14;--green:#34d399}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#27272c;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC",sans-serif;color:var(--text)}
  .window{width:700px;background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:0 34px 90px rgba(0,0,0,.48);overflow:hidden;transition:opacity .16s ease,transform .16s ease}
  .window.closed{opacity:0;transform:scale(.97);pointer-events:none}
  .content{padding:36px}
  .grid{display:grid;grid-template-columns:1.08fr .92fr;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px}
  .card h2{font-size:13px;margin:0 0 12px}
  .primary{width:100%;height:48px;border:0;border-radius:8px;background:var(--blue);color:var(--button-text);font-family:inherit;font-size:14px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:10px}
  .primary .shortcut{font-size:12px;font-weight:600;color:rgba(10,10,20,.64)}
  .usage-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.usage-top b{font-size:13px}.usage-top span{font-size:11px;color:var(--muted)}
  .track{height:7px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}.fill{width:30%;height:100%;background:var(--blue);border-radius:8px}.usage-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:10px}
  .shortcut-note{font-size:11px;color:var(--muted);margin-top:13px;text-align:center}
  .footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11.5px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(52,211,153,.1)}
  .secondary{border:0;background:rgba(255,255,255,.07);color:rgba(255,255,255,.5);border-radius:7px;padding:8px 13px;font-family:inherit;font-size:12px;font-weight:500}
  .dock{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);padding:7px 8px;background:rgba(245,245,248,.17);border:1px solid rgba(255,255,255,.22);border-radius:18px;backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(0,0,0,.28)}
  .dock-button{width:48px;height:48px;padding:0;border:0;border-radius:12px;background:linear-gradient(145deg,#333340,#17171d);display:grid;place-items:center;cursor:pointer;transition:transform .14s ease}
  .dock-button:hover{transform:translateY(-5px) scale(1.08)}.dock-button svg{width:30px;height:30px}
  .hint{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.38);font-size:11px;opacity:0;transition:opacity .18s}.window.closed~.hint{opacity:1}
</style>
</head>
<body>
<main class="window" id="homeWindow">
  <section class="content">
    <div class="grid">
      <article class="card">
        <button class="primary">開始截圖 <span class="shortcut">Control + Option + Q</span></button>
        <div class="shortcut-note">選取文字：Control + Option + A</div>
      </article>
      <article class="card">
        <div class="usage-top"><b>今日免費用量</b><span>3 / 10</span></div>
        <div class="track"><div class="fill"></div></div>
        <div class="usage-foot"><span>剩餘 7 次</span><span>4 小時 20 分後重置</span></div>
      </article>
    </div>
    <footer class="footer"><div class="status"><span class="dot"></span>已在背景待命</div><button class="secondary">偏好設定</button></footer>
  </section>
</main>
<div class="hint">視窗已關閉，點 Dock 圖示可再次喚醒</div>
<div class="dock"><button class="dock-button" id="dockButton" aria-label="開啟 Quill"><svg viewBox="0 0 64 64" fill="none"><path d="M45 13C34 16 24 25 20 40M20 40c9-1 17-5 23-12M20 40l-5 11" stroke="#f4f4f6" stroke-width="4" stroke-linecap="round"/><path d="M26 38c5 2 12 1 18-4 7-6 8-15 7-22-8 0-17 3-23 9-5 5-7 11-8 17" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/></svg></button></div>
<script>
  const homeWindow = document.getElementById('homeWindow');
  const dockButton = document.getElementById('dockButton');
  homeWindow.addEventListener('click', event => event.stopPropagation());
  dockButton.addEventListener('click', event => {
    event.stopPropagation();
    homeWindow.classList.remove('closed');
  });
  document.body.addEventListener('click', () => homeWindow.classList.add('closed'));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') homeWindow.classList.add('closed');
  });
</script>
</body>
</html>
